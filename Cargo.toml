[workspace]
members = [
    "youtube-client",
    "youtube-client-lib",
    "youtube-gui"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
eframe = "0.26.2"
egui = "0.26.2"
google-youtube3 = "7.0.0"
image = { version = "0.25", features = ["png", "jpeg"] }
open = "5.4.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
rodio = "0.22.2"
rusty_ytdl = "0.7.4"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
tokio = { version = "1.53.1" }
yup-oauth2 = "12.1.2"
youtube-client-lib = { path = "./youtube-client-lib" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

