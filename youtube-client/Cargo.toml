[package]
name = "youtube-client"
version = "0.1.1"
edition = "2024"
description = "CLI application for interacting with YouTube, managing playlists, subscriptions, and downloading videos."
license = "MIT"
repository = "https://github.com/clockworkengineer/youtube-client"
readme = "../README.md"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
youtube-client-lib = { workspace = true, features = ["audio", "download"] }
open.workspace = true
rodio.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true


