[workspace]
members = [
    "youtube-client",
    "youtube-client-lib",
    "youtube-gui",
    "youtube-installer"
]
resolver = "2"

[workspace.package]
authors = ["Rob Tizzard"]
edition = "2024"
license = "MIT"
repository = "https://github.com/clockworkengineer/youtube-client"
homepage = "https://github.com/clockworkengineer/youtube-client"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.5"
eframe = "0.26.2"
egui = "0.26.2"
google-youtube3 = "7.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5.4.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
rodio = "0.22.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
thiserror = "2.0.11"
tokio = { version = "1.53.1" }
yup-oauth2 = "12.1.2"
rand = "0.8"
http-body-util = "0.1"
youtube-client-lib = { path = "./youtube-client-lib", version = "0.1.3", default-features = false }

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "warn"
uninlined_format_args = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

