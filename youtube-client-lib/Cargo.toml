[package]
name = "youtube-client-lib"
version = "0.1.3"
edition = "2024"
description = "A Rust library for interacting with YouTube API v3, managing subscriptions, playlists, and downloading/streaming videos."
license = "MIT"
repository = "https://github.com/clockworkengineer/youtube-client"
readme = "../README.md"

[dependencies]
anyhow.workspace = true
google-youtube3.workspace = true
open.workspace = true
rodio = { workspace = true, optional = true }
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "process", "io-util"] }
yup-oauth2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rand = { workspace = true }

[features]
default = []
audio = ["dep:rodio"]
download = []
testing = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

