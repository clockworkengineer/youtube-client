[package]
name = "youtube-gui"
version = "0.1.3"
edition = "2024"
description = "Graphical user interface (egui) for YouTube client, supporting subscription browsing, video streaming, and background downloads."
license = "MIT"
repository = "https://github.com/clockworkengineer/youtube-client"
readme = "../README.md"

[dependencies]
eframe.workspace = true
egui.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
youtube-client-lib = { workspace = true, features = ["download", "audio"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true }
image = { workspace = true }
open.workspace = true
rodio.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints]
workspace = true




