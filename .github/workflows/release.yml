name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} -p youtube-client -p youtube-gui -p youtube-installer

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = "youtube-client-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dist
          Copy-Item "target/${{ matrix.target }}/release/youtube-client.exe" $dist/
          Copy-Item "target/${{ matrix.target }}/release/youtube-gui.exe" $dist/
          Copy-Item "target/${{ matrix.target }}/release/youtube-installer.exe" $dist/
          Copy-Item "assets/icon.ico" $dist/
          Copy-Item "assets/icon.png" $dist/
          Copy-Item "README.md" $dist/
          Copy-Item "LICENSE" $dist/
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip"

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        run: |
          tag="${{ github.ref_name }}"
          dist="youtube-client-$tag-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/youtube-client" "$dist/"
          cp "target/${{ matrix.target }}/release/youtube-gui" "$dist/"
          cp "target/${{ matrix.target }}/release/youtube-installer" "$dist/"
          cp "assets/icon.png" "$dist/"
          cp "README.md" "$dist/"
          cp "LICENSE" "$dist/"
          tar -czf "$dist.tar.gz" -C "$dist" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: youtube-client-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
